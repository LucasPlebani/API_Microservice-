version: "3.8"

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - auth
      - panier
    networks:
      - microservices

  auth:
    build:
      context: ./authMicroService
    ports:
      - "3000:3000"
    env_file:
      - ./authMicroService/.env
    networks:
      - microservices

  mongodb:
    image: mongo:6
    container_name: mongodb
    ports:
      - "27017:27017"
    networks:
      - microservices

  panier:
    build:
      context: ./panierMicroService
    ports:
      - "8000:8000"
    env_file:
      - ./panierMicroService/.env
    networks:
      - microservices

  # admin_dashboard:
  #   build: ./admin-dashboard
  #   ports:
  #     - "3001:80"

networks:
  microservices:
    driver: bridge
