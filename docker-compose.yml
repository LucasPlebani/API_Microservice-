version: '3.8'

services:
  nginx:
    build:
      context: ./nginx
    ports:
      - "8080:80"
    depends_on:
      - panier
    networks:
      - microservices

  panier:
    build:
      context: ./panierMicroService
    ports:
      - "8000:8000"
    env_file:
      - ./panierMicroService/.env
    networks:
      - microservices

networks:
  microservices:
    driver: bridge


