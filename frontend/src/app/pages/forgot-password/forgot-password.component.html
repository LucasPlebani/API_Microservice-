<div class="connectForm">
  <h2>Mot de passe oublié</h2>
  <form (ngSubmit)="onSubmit()" class="loginForm">
    <div class="inputForm">
      <label for="email">Email :</label>
      <input
        type="email"
        id="email"
        [(ngModel)]="email"
        name="email"
        required
      />
    </div>
    <button type="submit">Envoyer le lien</button>
  </form>
</div>
