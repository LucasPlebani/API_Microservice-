<div class="connectForm">
  <h2>Nouveau mot de passe</h2>
  <form (ngSubmit)="onSubmit()" class="loginForm">
    <div class="inputForm">
      <label for="newPassword">Nouveau mot de passe :</label>
      <input
        type="password"
        id="newPassword"
        [(ngModel)]="newPassword"
        name="newPassword"
        required
      />
    </div>
    <button type="submit">Réinitialiser</button>
    <p *ngIf="message">{{ message }}</p>
  </form>
</div>
